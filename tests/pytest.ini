[tool:pytest]
# Pytest configuration for CORE_GAME_MECHANICS AI system tests

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers for test categorization
markers =
    ai_integration: Tests for AI system integration
    performance: Performance validation tests
    unit: Unit tests for individual components
    integration: Integration tests between components
    benchmark: Performance benchmark tests
    slow: Tests that take longer to run

# Asyncio configuration
asyncio_mode = auto

# Test timeout (in seconds)
timeout = 300

# Minimum version requirements
minversion = 6.0

# Test coverage settings (if coverage plugin is available)
# addopts = --cov=CORE_GAME_MECHANICS --cov-report=html --cov-report=term

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:tensorflow.*
    ignore::UserWarning:torch.*